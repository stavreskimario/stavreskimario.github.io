name: Optional Pages publisher

# This remains disabled until the owner approves switching Pages to GitHub Actions.
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

# Serialize optional whole-site publishing. No feed collection or scheduled jobs.
concurrency:
  group: pages-production
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          persist-credentials: false
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate and stage the complete site
        run: |
          python3 scripts/validate.py
          python3 -m unittest discover -s tests -p 'test_site_staging.py'
          python3 scripts/site-publishing/stage.py "$RUNNER_TEMP/pages"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/pages
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse an outdated code revision
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BUILT_SHA: ${{ needs.build.outputs.revision }}
        run: |
          current=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          test "$current" = "$BUILT_SHA"
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
