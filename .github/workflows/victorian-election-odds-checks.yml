name: Victorian election atlas checks
on:
  pull_request:
    paths:
      - 'victorian-election-odds/**'
      - 'apps.json'
      - 'index.html'
      - 'tests/victorian-election-odds.cjs'
      - '.github/workflows/victorian-election-odds-checks.yml'
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 scripts/validate.py
      - name: Install Playwright browser
        run: |
          npm install --prefix "$RUNNER_TEMP/map-tools" playwright@1.51.1
          "$RUNNER_TEMP/map-tools/node_modules/.bin/playwright" install --with-deps chromium --only-shell
      - name: Exercise election map
        run: NODE_PATH="$RUNNER_TEMP/map-tools/node_modules" node tests/victorian-election-odds.cjs
